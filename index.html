<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11100F">
  <title>Nos hemos mudado | Atenas</title>
  <meta name="description" content="El proyecto continúa en su nueva web oficial: Atenas.">
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 22px;
      background: #11100F;
      color: #EEEAE3;
      font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    main { width: min(100%, 720px); }
    h1 {
      margin: 0 0 28px;
      font-size: clamp(30px, 6vw, 52px);
      line-height: 1.15;
      font-weight: 500;
      letter-spacing: -0.06em;
    }
    p {
      margin: 0 auto 18px;
      max-width: 590px;
      color: #EEEAE3;
      font-size: clamp(15px, 2.2vw, 18px);
      line-height: 1.8;
    }
    .link {
      display: inline-block;
      margin-top: 24px;
      padding: 14px 18px;
      border: 1px solid #EEEAE3;
      color: #EEEAE3;
      text-decoration: none;
      font-size: 14px;
      transition: background .2s ease, color .2s ease;
    }
    .link:hover, .link:focus-visible {
      background: #EEEAE3;
      color: #11100F;
      outline: none;
    }
    .address {
      display: block;
      margin-top: 13px;
      font-size: 12px;
      letter-spacing: .04em;
      opacity: .75;
    }
  </style>
</head>
<body>
  <main>
    <h1>Nos hemos mudado.</h1>
    <p>El proyecto continúa ahora bajo el nombre de Atenas.</p>
    <p>La música, las nuevas canciones y toda la información están en nuestra nueva web oficial.</p>
    <a class="link" href="https://atenas.top/">Visitar la nueva web</a>
    <span class="address">atenas.top</span>
  </main>
</body>
</html>
