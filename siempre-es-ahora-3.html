<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11100f">
  <title>Siempre es ahora</title>
  <meta name="description" content="Siempre es ahora. Atenas.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 28px 22px;
      overflow: hidden;
      background: #11100f;
      color: #eeeae3;
      font-family: "JetBrains Mono", monospace;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 34px;
    }
    h1 {
      margin: 0;
      font-size: clamp(27px, 7vw, 54px);
      line-height: 1.3;
      font-weight: 300;
      letter-spacing: -.075em;
      opacity: 0;
      filter: blur(9px);
      transform: translateY(9px);
      animation: appear 1.7s cubic-bezier(.2,.7,.2,1) .25s forwards;
    }
    a, a:link, a:visited, a:hover, a:active, a:focus {
      color: #eeeae3 !important;
      text-decoration: none !important;
      border: 0 !important;
      box-shadow: none !important;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: .08em;
      opacity: 0;
      filter: blur(5px);
      transform: translateY(5px);
      animation: appear 1.4s cubic-bezier(.2,.7,.2,1) 1.65s forwards;
      transition: opacity .25s ease, text-decoration-color .25s ease;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    a:hover, a:focus-visible {
      color: #eeeae3 !important;
      text-decoration: none !important;
      outline: none;
    }
    @keyframes appear {
      to { opacity: 1; filter: blur(0); transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      h1, a {
        animation: none;
        opacity: 1;
        filter: none;
        transform: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Siempre es ahora</h1>
    <a href="https://atenas.top/" aria-label="Entrar en Atenas">ATENAS</a>
  </main>
</body>
</html>
